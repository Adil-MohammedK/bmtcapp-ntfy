name: Bug report
description: Report a problem with the Home Assistant integration, API, or web app.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues for a similar report.
        **Do not include credentials, tokens, private URLs, or personal data.**
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did you encounter the problem?
      options:
        - Home Assistant integration
        - Transit API service
        - Web app
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Integration/release version, or the commit you are using.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      description: If this does not involve Home Assistant, enter "Not applicable".
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Describe the problem
      description: Include relevant error messages, with sensitive information removed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, credentials, private URLs, and personal data before posting.
      render: text
    validations:
      required: false
