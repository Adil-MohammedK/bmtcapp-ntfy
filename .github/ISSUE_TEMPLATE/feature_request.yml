name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search existing issues for a similar suggestion.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Explain how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternatives or workarounds you have considered.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Home Assistant integration
        - Transit API service
        - Web app
        - Documentation
        - Other
    validations:
      required: true
